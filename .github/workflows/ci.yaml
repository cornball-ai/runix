name: ci

on:
  push:
    branches: [master]
  pull_request:

# Least privilege: CI only reads the repo (no releases, comments, or writes).
permissions:
  contents: read

# One run per ref; a new push to a PR cancels the superseded run (but never a
# master run, which we let finish).
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  _R_CHECK_FORCE_SUGGESTS_: "false"

jobs:
  # Linux: the broker's real platform. Build the sibling broker daemon, then run
  # the full tinytest suite as "at home" (tinytest::at_home() is TRUE outside
  # R CMD check) so the hostile fake-responder battery AND the live-broker
  # round-trips actually run -- not just the schema fixtures.
  linux:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6

      - name: Setup r-ci
        uses: eddelbuettel/github-actions/r-ci@master
        with:
          backend: RAPT

      - name: System build deps (for the broker daemon)
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends libjansson-dev pkg-config build-essential

      # janssonr (runix's one Import) ships as an apt binary from the cornball
      # apt repository (rapt's pattern, unsigned -> Trusted: yes). It pulls the
      # Jansson runtime via Depends -- no compile of janssonr itself. (The
      # broker daemon still builds against libjansson-dev above.)
      - name: Install janssonr from the cornball apt repository
        run: |
          sudo tee /etc/apt/sources.list.d/janssonr.sources > /dev/null <<'EOF'
          Types: deb
          URIs: https://cornball-ai.github.io/janssonr
          Suites: noble
          Components: main
          Trusted: yes
          Enabled: yes
          EOF
          sudo apt-get update
          sudo apt-get install -y r-cornball-janssonr

      - name: R dependencies
        run: ./run.sh install_deps

      # The broker daemon lives in the PUBLIC sibling repo. Building it is
      # mandatory (not skippable): the live-broker round-trips are part of the
      # Linux contract. Pinned to the immutable release tag v0.0.1.
      - name: Build the broker daemon (public sibling repo)
        run: |
          git clone --depth 1 --branch v0.0.1 \
            https://github.com/cornball-ai/runix-audit-broker.git "${RUNNER_TEMP}/rab"
          make -C "${RUNNER_TEMP}/rab"
          echo "RUNIX_TEST_BROKER_BIN=${RUNNER_TEMP}/rab/audit-broker" >> "$GITHUB_ENV"

      - name: Install runix (compiles the AF_UNIX client)
        run: R CMD INSTALL .

      - name: Tests (fake-responder battery + live broker when armed)
        run: |
          Rscript -e 'r <- tinytest::test_package("runix"); n <- sum(!vapply(r, isTRUE, logical(1))); cat(length(r), "checks,", n, "failures\n"); quit(status = as.integer(n > 0))'

      - name: R CMD check (CRAN cleanliness)
        run: ./run.sh run_tests

  # Non-Linux Unix (macOS): runix is a Unix package, but the broker is
  # Linux-only. On other Unix the package must still install, load, and keep its
  # portable sinks working while every broker call returns a typed
  # runix_broker_unavailable (the compiled stub) -- proof the broker transport's
  # __linux__ guard holds and no Linux-only header leaks into the stub. Windows
  # is out of scope (runix administers a Linux host).
  stub:
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v6

      - uses: r-lib/actions/setup-r@v2
        with:
          use-public-rspm: true

      # runix Imports janssonr on every platform (the broker sink parser uses it,
      # even where the transport is the compiled stub). Off Linux it builds from
      # source against Homebrew's jansson; pull the versioned tarball from the
      # drat. tinytest comes from the default repo. We install both directly
      # rather than via setup-r-dependencies: pak's solver does not resolve the
      # drat-only janssonr, and these are the package's only dep + test dep.
      - name: libjansson (brew) + janssonr from the cornball drat + tinytest
        run: |
          brew install jansson
          Rscript -e 'download.packages("janssonr", ".", repos = "https://cornball-ai.github.io/drat", type = "source")'
          R CMD INSTALL janssonr_*.tar.gz
          Rscript -e 'install.packages("tinytest")'

      # bash so `R CMD INSTALL` runs the same everywhere (the Windows runner's
      # default shell is PowerShell, which mis-parses `R CMD INSTALL .`)
      - name: Install runix (compiles the guarded stub)
        shell: bash
        run: R CMD INSTALL .

      - name: Gate 5 - install/load, broker typed-unavailable, portable sinks
        shell: Rscript {0}
        run: |
          library(runix)
          ## the broker is Linux-only: every call is typed-unavailable here,
          ## claiming no scope, and never throwing
          s <- broker_audit_sink()
          r <- s$open_intent(list(operation = "x", outcome = "intent"))
          stopifnot(!isTRUE(r$persisted),
                    identical(r$error, "runix_broker_unavailable"),
                    is.na(r$audit_scope))
          stopifnot(identical(
              s$emit(list(outcome = "preview"), "preview")$error,
              "runix_broker_unavailable"))
          ## portable sinks remain functional in their platform-honest modes
          m <- memory_audit_sink()
          stopifnot(isTRUE(m$emit(list(outcome = "ok"), "outcome")$persisted))
          f <- file_audit_sink(tempfile(fileext = ".jsonl"), durability = "none")
          stopifnot(isTRUE(f$emit(list(outcome = "ok"), "outcome")$persisted))
          ## the shared response-schema corpus validates identically off Linux
          man <- read.delim(system.file("tinytest", "fixtures",
              "broker-frames", "manifest.tsv", package = "runix"),
              stringsAsFactors = FALSE)
          man <- man[man$layer == "body", ]
          pr <- getFromNamespace(".broker_parse_response", "runix")
          bad <- 0L
          for (i in seq_len(nrow(man))) {
            body <- readBin(system.file("tinytest", "fixtures", "broker-frames",
                man$file[i], package = "runix"), "raw", n = 1e5)
            accepted <- !identical(pr(body)$kind, "invalid")
            if (accepted != (man$accept[i] == 1L)) bad <- bad + 1L
          }
          stopifnot(bad == 0L)
          cat("gate 5 OK on", Sys.info()[["sysname"]], "\n")

      # macOS has a POSIX `sync` (no --data): prove the syncer fallback makes
      # fsync file durability genuinely hold there. Windows has no `sync`, so
      # fsync durability is honestly unavailable and not asserted.
      - name: macOS - fsync file durability via the sync fallback
        if: runner.os == 'macOS'
        shell: Rscript {0}
        run: |
          library(runix)
          f <- file_audit_sink(tempfile(fileext = ".jsonl"), durability = "fsync")
          stopifnot(isTRUE(f$emit(list(outcome = "ok"), "outcome")$persisted))
          cat("macOS fsync OK\n")

  # The VM gate. GitHub's Ubuntu runner is an ephemeral VM with systemd and an
  # unprivileged user holding passwordless sudo -- exactly what this needs.
  # Proves the whole production chain: an unprivileged R client -> the root,
  # socket-activated broker daemon (installed from its .deb) -> a root-owned
  # durable SYSTEM record, across a broker restart between intent and outcome,
  # with the record carrying the unprivileged caller's kernel identity; and that
  # the unavailable/untrusted paths never advertise system durability.
  integration:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6

      - name: Prove systemd is the service manager
        run: test -d /run/systemd/system

      - name: Build + install the broker .deb, socket-activate it (as root)
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libjansson-dev pkg-config build-essential debhelper fakeroot
          git clone --depth 1 --branch v0.0.1 \
            https://github.com/cornball-ai/runix-audit-broker.git "${RUNNER_TEMP}/rab"
          cd "${RUNNER_TEMP}/rab"
          dpkg-buildpackage -us -uc -b
          sudo dpkg -i ../runix-audit-broker_*.deb
          sudo systemctl daemon-reload
          sudo systemctl start runix-audit.socket
          test -S /run/runix-audit.sock

      - name: Setup r-ci
        uses: eddelbuettel/github-actions/r-ci@master
        with:
          backend: RAPT
      - name: Install janssonr from the cornball apt repository
        run: |
          sudo tee /etc/apt/sources.list.d/janssonr.sources > /dev/null <<'EOF'
          Types: deb
          URIs: https://cornball-ai.github.io/janssonr
          Suites: noble
          Components: main
          Trusted: yes
          Enabled: yes
          EOF
          sudo apt-get update
          sudo apt-get install -y r-cornball-janssonr
      - name: R dependencies
        run: ./run.sh install_deps
      - name: Install runix
        run: R CMD INSTALL .

      - name: Unprivileged client - system-durable record across a restart
        run: Rscript .github/integration/client.R

      - name: Root-inspect the durable sink (IDs, identity, permissions)
        run: |
          sudo cat /var/log/runix/audit.jsonl > /tmp/rab-sink-copy.jsonl
          sudo stat -c '%U %a' /var/log/runix/audit.jsonl > /tmp/rab-sink-perms.txt
          export RAB_CLIENT_UID="$(id -u)"
          Rscript .github/integration/inspect.R
